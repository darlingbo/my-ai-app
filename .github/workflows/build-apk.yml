name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # Rename so the download is clearly named
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyAI.apk

      # Publish to ONE permanent release (replaces the old APK every build)
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "📱 My AI — Latest App (always newest)"
          body: "Tap MyAI.apk below to download the newest version. This always replaces the old one."
          files: MyAI.apk
